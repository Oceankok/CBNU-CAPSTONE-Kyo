# YOLO dataset config for the cleaned PPE dataset.
# Project labeling rule:
#   0: helmet
#   1: vest
#   2: person
#
# no_helmet is not labeled as an object class.
# It should be derived later from the relation between person and helmet boxes.

path: ../data/merged/ppe_split
train: train/images
val: val/images
test: test/images

names:
  0: helmet
  1: vest
  2: person