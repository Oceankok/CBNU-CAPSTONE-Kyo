name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after production approval (server runner must be configured)
        type: boolean
        default: false
      https:
        description: Enable public HTTPS (domain and inbound ports must be ready)
        type: boolean
        default: false
      lan:
        description: Open the web port to a trusted LAN for HTTP demo access (not with HTTPS)
        type: boolean
        default: false
      tunnel_https:
        description: Use an existing HTTPS tunnel to the localhost web port (not with https/lan)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kyo-release
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
      images: ${{ steps.verify.outputs.images }}
    steps:
      - id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const commit = context.eventName === 'workflow_run' ? context.payload.workflow_run.head_sha : context.sha;
            if (!/^[0-9a-f]{40}$/.test(commit)) throw new Error('Invalid release commit');
            if (context.eventName === 'workflow_dispatch') {
              const enabled = value => value === true || value === 'true';
              if (['lan', 'https', 'tunnel_https'].filter(key => enabled(context.payload.inputs[key])).length > 1) throw new Error('Choose one access mode: LAN HTTP, Caddy HTTPS, or tunnel HTTPS');
              const runs = await github.rest.actions.listWorkflowRuns({...context.repo, workflow_id:'ci.yml', branch:'main', event:'push', head_sha:commit, status:'success'});
              if (!runs.data.workflow_runs.some(r => r.head_sha === commit)) throw new Error('Successful main CI required');
              if (context.payload.inputs.deploy === true || context.payload.inputs.deploy === 'true') {
                const result = await github.rest.repos.getEnvironment({...context.repo, environment_name:'production'});
                const rules = result.data.protection_rules || [];
                if (!rules.some(r => r.type === 'required_reviewers' && r.reviewers?.length)) throw new Error('Configure production required reviewers before deployment');
                const policy = result.data.deployment_branch_policy;
                if (!policy?.custom_branch_policies) throw new Error('Configure production custom deployment branch policy: main only');
                const branches = await github.rest.repos.listDeploymentBranchPolicies({...context.repo, environment_name:'production'});
                if (branches.data.branch_policies.length !== 1 || branches.data.branch_policies[0].name !== 'main' || branches.data.branch_policies[0].type !== 'branch') throw new Error('production must allow only main branch');
              }
            }
            core.setOutput('commit', commit);
            core.setOutput('images', 'ghcr.io/' + context.repo.owner.toLowerCase() + '/' + context.repo.repo.toLowerCase());
  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.api.outputs.digest }}
      web: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ needs.gate.outputs.images }}-api:${{ needs.gate.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.gate.outputs.commit }}
          cache-from: type=gha,scope=kyo-api
          cache-to: type=gha,scope=kyo-api,mode=max
      - id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ needs.gate.outputs.images }}-web:${{ needs.gate.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.gate.outputs.commit }}
          cache-from: type=gha,scope=kyo-web
          cache-to: type=gha,scope=kyo-web,mode=max
      - name: Release references
        env:
          IMAGE_ROOT: ${{ needs.gate.outputs.images }}
          COMMIT: ${{ needs.gate.outputs.commit }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          printf 'Commit: %s\nAPI: %s-api@%s\nWeb: %s-web@%s\n' "$COMMIT" "$IMAGE_ROOT" "$API_DIGEST" "$IMAGE_ROOT" "$WEB_DIGEST" | tee release.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-references
          path: release.txt
  deploy:
    needs: [gate, publish]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy
    environment: production
    runs-on: [self-hosted, Windows, X64, kyo-deploy]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      DOCKER_HOST: npipe:////./pipe/dockerDesktopLinuxEngine
      DEPLOYMENT_ROOT: ${{ vars.KYO_DEPLOY_ROOT }}
      DEPLOYMENT_PROJECT: ${{ vars.KYO_DEPLOY_PROJECT || 'kyo-server' }}
      API_IMAGE: ${{ needs.gate.outputs.images }}-api@${{ needs.publish.outputs.api }}
      WEB_IMAGE: ${{ needs.gate.outputs.images }}-web@${{ needs.publish.outputs.web }}
      RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
      RELEASE_HTTPS: ${{ inputs.https }}
      RELEASE_LAN: ${{ inputs.lan }}
      RELEASE_TUNNEL_HTTPS: ${{ inputs.tunnel_https }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false
      - name: Prepare isolated Docker configuration
        shell: pwsh
        run: |
          if (-not $env:DEPLOYMENT_ROOT) { throw 'Set production KYO_DEPLOY_ROOT variable' }
          if ($env:DEPLOYMENT_PROJECT -notmatch '^[a-z][a-z0-9-]{2,40}$') { throw 'Invalid production KYO_DEPLOY_PROJECT' }
          ./deploy/Prepare-Docker.ps1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply approved release
        shell: pwsh
        run: |
          ./deploy/Release.ps1 -Project $env:DEPLOYMENT_PROJECT -DeploymentRoot $env:DEPLOYMENT_ROOT -Commit $env:RELEASE_COMMIT -ApiImage $env:API_IMAGE -WebImage $env:WEB_IMAGE -Https:($env:RELEASE_HTTPS -eq 'true') -Lan:($env:RELEASE_LAN -eq 'true') -TunnelHttps:($env:RELEASE_TUNNEL_HTTPS -eq 'true')
      - name: Remove temporary registry credentials
        if: always()
        shell: pwsh
        run: |
          if (-not $env:DOCKER_CONFIG) { return }
          $target = [IO.Path]::GetFullPath($env:DOCKER_CONFIG)
          $root = [IO.Path]::GetFullPath($env:RUNNER_TEMP) + [IO.Path]::DirectorySeparatorChar
          if (-not $target.StartsWith($root, [StringComparison]::OrdinalIgnoreCase)) { throw 'Unsafe cleanup path' }
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
