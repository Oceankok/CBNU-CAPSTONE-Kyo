name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GitHub Actions syntax
        run: |
          docker run --rm --network none --mount "type=bind,source=${GITHUB_WORKSPACE}/.github,target=/config,readonly" rhysd/actionlint:1.7.7 -config-file /config/actionlint.yaml /config/workflows/ci.yml /config/workflows/release.yml
  release-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolated deployment rollback checks (fake Docker)
        shell: pwsh
        run: |
          ./deploy/tests/Release.Tests.ps1
          ./deploy/tests/Prepare-Docker.Tests.ps1
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        # ponytail: tests never load the CUDA face models, so skip the large onnxruntime-gpu wheel
        run: |
          grep -v '^onnxruntime-gpu' backend/requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt -r video_sender/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s backend -t . -v

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kyo_test
          POSTGRES_USER: kyo_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kyo_test -d kyo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PPE_TEST_POSTGRES_URL: postgresql://kyo_test:ci-only-password@127.0.0.1:5432/kyo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-api.txt
      - run: pip install -r backend/requirements-api.txt -r video_sender/requirements.txt
      - name: PostgreSQL regression tests (isolated schemas)
        run: python -m unittest discover -s backend -t . -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit checks
        run: npm test
      - name: Type check and build
        run: npm run build
