name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GitHub Actions syntax
        run: |
          docker run --rm --network none --mount "type=bind,source=${GITHUB_WORKSPACE}/.github,target=/config,readonly" rhysd/actionlint:1.7.7 -config-file /config/actionlint.yaml /config/workflows/ci.yml /config/workflows/release.yml
  release-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Versioned host wrapper and owned Windows process trees
        shell: pwsh
        timeout-minutes: 5
        run: |
          python -m pip install 'httpx>=0.28,<1'
          python -m unittest deploy.tests.test_runtime_processes deploy.tests.test_host_runtime -v
      - name: Isolated deployment rollback checks (fake Docker)
        shell: pwsh
        run: |
          ./deploy/tests/Release.Tests.ps1
          ./deploy/tests/Prepare-Docker.Tests.ps1
          ./deploy/tests/Remote-Camera.Tests.ps1
          ./deploy/tests/Cloudflare-Tunnel.Tests.ps1
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        # ponytail: tests never load the CUDA face models, so skip the large onnxruntime-gpu wheel
        run: |
          grep -v '^onnxruntime-gpu' backend/requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt -r video_sender/requirements.txt
      - name: Synthetic video test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: CPU tracking dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r inference_worker/requirements-tracking.txt
          python -c "from inference_worker.person_tracker import PersonTracker; from inference_worker.ppe_rules import assess_ppe; PersonTracker(); assess_ppe([], (64, 64, 3))"
      - name: Unit tests
        run: |
          python -m unittest discover -s backend -t . -v
          python -m unittest discover -s inference_worker -t . -v
      - name: Owned POSIX process trees and host tooling
        timeout-minutes: 5
        run: python -m unittest deploy.tests.test_runtime_processes deploy.tests.test_host_runtime -v

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kyo_test
          POSTGRES_USER: kyo_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kyo_test -d kyo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PPE_TEST_POSTGRES_URL: postgresql://kyo_test:ci-only-password@127.0.0.1:5432/kyo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-api.txt
      - run: pip install -r backend/requirements-api.txt -r video_sender/requirements.txt
      - name: Synthetic video test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: CPU tracking dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r inference_worker/requirements-tracking.txt
          python -c "from inference_worker.person_tracker import PersonTracker; from inference_worker.ppe_rules import assess_ppe; PersonTracker(); assess_ppe([], (64, 64, 3))"
      - name: PostgreSQL regression tests (isolated schemas)
        run: |
          python -m unittest discover -s backend -t . -v
          python -m unittest discover -s inference_worker -t . -v

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-api.txt
      - run: pip install -r backend/requirements-api.txt
      - name: Disposable Docker API/web/PostgreSQL integration
        run: python deploy/tests/validate_backend_integration.py
      - uses: actions/upload-artifact@v4
        with:
          name: backend-integration-results
          path: .private_media/backend-integration-results.json
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Unit checks
        run: npm test
      - name: Education browser regression checks (isolated HTTP mocks)
        run: npm run test:education:browser
      - name: Education translation browser checks (isolated HTTP mocks)
        run: npm run test:translations:browser
      - name: Automatic rule UI browser checks (isolated HTTP mocks)
        timeout-minutes: 5
        run: npm run test:auto-rules:browser
      - name: Continuous evidence review browser checks (isolated HTTP mocks)
        timeout-minutes: 5
        run: npx playwright test --config playwright.terminal-evidence.config.ts
      - name: Terminal evidence display checks (saved API fixtures)
        timeout-minutes: 5
        run: npx playwright test --config playwright.terminal-evidence.config.ts
      - name: Zone rule locks and revision recovery (isolated HTTP mocks)
        timeout-minutes: 5
        run: |
          npx playwright test --config playwright.zone-rules.config.ts
          npx playwright test --config playwright.zone-cas.config.ts
      - name: Upload zone browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zone-browser-results
          include-hidden-files: true
          path: |
            frontend/.private_media/zone-rules-browser/
            frontend/.private_media/zone-cas-browser/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload education browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: education-browser-results
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Type check and build
        run: npm run build
