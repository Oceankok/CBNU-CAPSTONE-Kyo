# Same-origin front door: static React app + reverse proxy to the API container.
# The browser only talks to this server, so no CORS is needed and the media cookie stays first-party.

upstream api {
    server api:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Large enough for event clip uploads (backend limit: 100 MiB)
    client_max_body_size 110m;

    # Server-level defaults; locations that set their own add_header repeat them (nginx does not inherit then)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # API: JSON requests plus raw image/video uploads (streamed, not buffered to disk first)
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        # Equipment recognition calls an external model (up to ~30 s)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Redacted media: admin cookie is checked by the API; keep Range requests working for video seeking
    location /storage/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Only these API paths are exposed; /docs and /openapi.json stay internal
    location = /health/ready {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    # Hashed build assets never change: cache for a year
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    # SPA fallback: /review/EVT_0001 etc. open directly and survive a refresh
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
}
